<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Drain Tracker</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e63c4">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Aplica el tema guardado ANTES de que Angular arranque, evita el flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('app-theme') || 'light';
        var isDark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // por si localStorage no está disponible en algún WebView
      }
    })();
  </script>
</head>

<body class="bg-surface-white dark:bg-surface-white-dark">
  <app-root></app-root>
</body>

</html>
