@if (onboardingComplete() === null) {
<div class="flex min-h-screen items-center justify-center bg-surface-alt dark:bg-surface-white-dark">
    <i class="pi pi-spin pi-spinner text-2xl text-blue dark:text-blue-dark"></i>
</div>
} @else if (onboardingComplete() === false) {
<app-onboarding (completed)="onOnboardingCompleted()" />
} @else {
<div class="min-h-screen bg-surface-alt pb-[calc(5rem+env(safe-area-inset-bottom))] [padding-top:max(1.5rem,env(safe-area-inset-top))] dark:bg-surface-white-dark">
    <div class="px-4 [padding-left:max(1rem,env(safe-area-inset-left))] [padding-right:max(1rem,env(safe-area-inset-right))]">
        <p-toast position="top-center" />
        <router-outlet />
    </div>
    <app-page-footer></app-page-footer>
</div>
}
