@if (onboardingComplete() === null) {
<div class="flex min-h-screen items-center justify-center bg-surface-alt dark:bg-surface-white-dark">
    <i class="pi pi-spin pi-spinner text-2xl text-blue dark:text-blue-dark"></i>
</div>
} @else if (onboardingComplete() === false) {
<app-onboarding (completed)="onOnboardingCompleted()" />
} @else {
<div class="min-h-screen bg-surface-alt pb-20 pt-[env(safe-area-inset-top)] dark:bg-surface-white-dark">
    <router-outlet />
    <app-page-footer></app-page-footer>
</div>
}
