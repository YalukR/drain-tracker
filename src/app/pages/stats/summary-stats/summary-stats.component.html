<div class="grid grid-cols-2 gap-2.5">
    <div
        class="anim-fade-up delay-1 rounded-xl border border-border bg-surface-white p-4 text-center dark:border-border-dark dark:bg-surface-white-dark">
        <div class="text-2xl font-bold text-blue dark:text-blue-dark">{{ totalLogs() }}</div>
        <div class="mt-1 text-xs text-muted dark:text-muted-dark">Limpiezas</div>
    </div>
    <div
        class="anim-fade-up delay-2 rounded-xl border border-border bg-surface-white p-4 text-center dark:border-border-dark dark:bg-surface-white-dark">
        <div class="text-2xl font-bold text-blue dark:text-blue-dark">{{ totalMl() }}</div>
        <div class="mt-1 text-xs text-muted dark:text-muted-dark">ml totales</div>
    </div>
    <div
        class="anim-fade-up delay-3 rounded-xl border border-border bg-surface-white p-4 text-center dark:border-border-dark dark:bg-surface-white-dark">
        <div class="text-2xl font-bold text-blue dark:text-blue-dark">{{ avgMl() }}</div>
        <div class="mt-1 text-xs text-muted dark:text-muted-dark">ml promedio</div>
    </div>
    <div
        class="anim-fade-up delay-4 rounded-xl border border-border bg-surface-white p-4 text-center dark:border-border-dark dark:bg-surface-white-dark">
        <div [class]="'text-xl font-bold ' + trendColorClass()">
            <i [class]="'pi ' + trendIcon()"></i>
        </div>
        <div class="mt-1 text-xs text-muted dark:text-muted-dark">Tendencia</div>
        <div [class]="'mt-0.5 text-[11px] font-semibold ' + trendColorClass()">
            {{ trendLabel() }}
        </div>
    </div>
</div>
