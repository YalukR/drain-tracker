<button
    class="mt-[18px] flex flex-shrink-0 items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-muted transition-colors hover:bg-surface-alt disabled:opacity-50 dark:text-muted-dark dark:hover:bg-surface-alt-dark"
    (click)="downloadPdf()" [disabled]="generating()">
    @if (generating()) {
    <i class="pi pi-spin pi-spinner"></i>
    } @else {
    <i class="pi pi-file-pdf"></i>
    }
    PDF
</button>
