<div class="page anim-fade-in flex min-h-screen flex-col justify-center px-6">

    <div class="mb-8 text-center">
        <div
            class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-blue-soft dark:bg-blue-soft-dark">
            <i class="pi pi-heart text-2xl text-blue dark:text-blue-dark"></i>
        </div>
        <p class="mb-1 text-xs font-semibold uppercase tracking-wide text-blue dark:text-blue-dark">
            Bienvenido
        </p>
        <h1 class="text-2xl font-bold text-main dark:text-main-dark">
            Seguimiento de drenajes
        </h1>
    </div>

    <div
        class="mb-8 flex flex-col gap-4 rounded-xl border border-border bg-surface-white p-5 dark:border-border-dark dark:bg-surface-white-dark">
        <div class="flex items-start gap-3">
            <i class="pi pi-plus-circle mt-0.5 flex-shrink-0 text-lg text-blue dark:text-blue-dark"></i>
            <p class="text-sm text-muted dark:text-muted-dark">
                Registra cada vaciado de tus drenajes: cantidad, color del líquido y cualquier síntoma.
            </p>
        </div>
        <div class="flex items-start gap-3">
            <i class="pi pi-chart-bar mt-0.5 flex-shrink-0 text-lg text-blue dark:text-blue-dark"></i>
            <p class="text-sm text-muted dark:text-muted-dark">
                Consulta tendencias y estadísticas para compartir con tu médico.
            </p>
        </div>
        <div class="flex items-start gap-3">
            <i class="pi pi-lock mt-0.5 flex-shrink-0 text-lg text-blue dark:text-blue-dark"></i>
            <p class="text-sm text-muted dark:text-muted-dark">
                Toda tu información se guarda únicamente en este dispositivo.
            </p>
        </div>
    </div>

    <p class="mb-4 text-center text-sm text-muted dark:text-muted-dark">
        Para comenzar, configura tus drenajes.
    </p>

    <p-button styleClass="w-full" label="Comenzar" icon="pi pi-arrow-right" iconPos="right"
        (onClick)="continueClicked.emit()" />

</div>
