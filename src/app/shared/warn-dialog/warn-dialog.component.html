<app-dialog-component [header]="header" [visible]="visible" (visibleChange)="onVisibleChange($event)"
    [maxWidth]="maxWidth">
    <div class="flex flex-col gap-4">
        <p class="text-sm text-main dark:text-main-dark m-0">{{ message }}</p>

        <div class="flex flex-col gap-1.5">
            <label class="text-xs text-muted dark:text-muted-dark" for="confirm-input">
                Escribe <span class="font-semibold text-main dark:text-main-dark">"{{ confirmWord }}"</span> para
                continuar
            </label>
            <input id="confirm-input" type="text"
                class="border border-border dark:border-border-dark rounded-md px-3 py-2 text-sm text-main dark:text-main-dark bg-transparent focus:outline-none focus:border-blue"
                [(ngModel)]="confirmationText" (keyup.enter)="onAccept()" autocomplete="off" />
        </div>
    </div>

    <div dialog-footer class="flex gap-2">
        <button type="button"
            class="border border-border dark:border-border-dark text-main dark:text-main-dark text-sm font-medium rounded-md px-4 py-2 hover:bg-surface-alt dark:hover:bg-surface-alt-dark transition-colors"
            (click)="onCancel()">
            {{ rejectLabel }}
        </button>
        <p-button [label]="acceptLabel" severity="danger" [disabled]="!isValid" [loading]="loading"
            (onClick)="onAccept()"></p-button>
    </div>
</app-dialog-component>
