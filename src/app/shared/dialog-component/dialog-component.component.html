<div class="fixed inset-0 z-[1000] flex items-center justify-center px-4" *ngIf="visible">
    <div class="absolute inset-0 bg-black/50" (click)="onBackdropClick()"></div>

    <div class="relative w-full bg-surface-white dark:bg-surface-white-dark rounded-[10px] shadow-xl max-h-[85vh] flex flex-col"
        [style.max-width]="maxWidth">
        <div
            class="flex items-center justify-between gap-3 px-4 py-3 border-b border-border dark:border-border-dark flex-none">
            <h3 class="text-base font-semibold text-main dark:text-main-dark m-0 truncate">{{ header }}</h3>
            <button type="button"
                class="w-7 h-7 flex-none flex items-center justify-center rounded-full text-muted dark:text-muted-dark hover:bg-surface-alt dark:hover:bg-surface-alt-dark hover:text-main dark:hover:text-main-dark transition-colors"
                (click)="close()">
                <i class="pi pi-times text-sm"></i>
            </button>
        </div>

        <div class="px-4 py-4 overflow-y-auto flex-1">
            <ng-content></ng-content>
        </div>

        <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-border dark:border-border-dark flex-none"
            *ngIf="showFooter">
            <ng-content select="[dialog-footer]"></ng-content>
        </div>
    </div>
</div>
